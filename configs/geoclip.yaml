# =============================================================================
# geoclip.yaml — flat-конфіг для train.py / TrainConfig
# Архітектура: CLIP ViT + RandomFourierGPSEncoder, InfoNCE контрастивне навчання
# =============================================================================

# ── Дані ─────────────────────────────────────────────────────────────────────
manifest_path:      "dataset/manifests/train.csv"   # + сусідні val.csv/test.csv
image_root:         "dataset_fast"   # зменшені до 384px (scripts/preprocess_resize.py)
countries:          ["PL", "CZ", "HU"]
quality_threshold:  0.0
split_method:       "prebuilt"    # готові спліти (scripts/06_…); без витоку
img_size:           224            # CLIP ViT очікує 224px

# ── Архітектура ──────────────────────────────────────────────────────────────
architecture:       "geoclip"
pretrained:         true

# ── Стадія 1: Навчання GPS-енкодера + голови, CLIP заморожено ────────────────
stage1_epochs:      12
stage1_lr:          0.0005
stage1_unfreeze_n:  0

# ── Стадія 2: Розморожування останніх блоків CLIP ────────────────────────────
stage2_epochs:      18
stage2_lr:          0.0001          # gps/classifier=1e-4, CLIP backbone=1e-5 (0.1x)
stage2_unfreeze_n:  4                # к-сть останніх ViT-шарів CLIP для розморожування

# ── Оптимізатор / регуляризація ──────────────────────────────────────────────
weight_decay:       0.01
batch_size:         96               # 3090 24GB: InfoNCE (більше негативів = краще)
num_workers:        12               # 16-ядерний CPU
grad_clip:          1.0

# ── Early stopping ───────────────────────────────────────────────────────────
patience:           10
min_delta:          0.0001

# ── Логування ────────────────────────────────────────────────────────────────
use_wandb:          false
use_mlflow:         false
wandb_project:      "ua-street-geolocation"
wandb_run_name:     "geoclip-contrastive"
mlflow_uri:         "mlruns"
experiment_name:    "geolocation-geoclip"

# ── Збереження ───────────────────────────────────────────────────────────────
checkpoint_dir:     "checkpoints/geoclip"
save_top_k:         1            # економимо диск

# ── Відтворюваність ──────────────────────────────────────────────────────────
seed:               42
mixed_precision:    true
cudnn_benchmark:    true
