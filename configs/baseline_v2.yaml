# =============================================================================
# baseline_v2.yaml — Street View dataset (Kyiv + Warsaw + Prague + Budapest)
# Архітектура: EfficientNet-B2 + кастомна голова класифікатора (4 класи)
# =============================================================================

# ── Дані ─────────────────────────────────────────────────────────────────────
manifest_path:      "dataset/manifests_sv/train.csv"   # + val.csv/test.csv поруч
image_root:         "."            # filepath = data/images/<city>/...  (SV 640px)
countries:          ["UA", "PL", "CZ", "HU"]
quality_threshold:  0.0
split_method:       "prebuilt"     # готові спліти (scripts/07_…); без витоку
img_size:           260            # нативна роздільна здатність EfficientNet-B2

# ── Архітектура ──────────────────────────────────────────────────────────────
architecture:       "baseline"
pretrained:         true

# ── Стадія 1: Заморожений backbone ───────────────────────────────────────────
stage1_epochs:      10
stage1_lr:          0.001
stage1_unfreeze_n:  0

# ── Стадія 2: Тонке налаштування останніх блоків ─────────────────────────────
stage2_epochs:      20
stage2_lr:          0.0001
stage2_unfreeze_n:  3

# ── Оптимізатор / регуляризація ──────────────────────────────────────────────
weight_decay:       0.01
batch_size:         64
num_workers:        12
grad_clip:          1.0

# ── Early stopping ───────────────────────────────────────────────────────────
patience:           7
min_delta:          0.0001

# ── Логування ────────────────────────────────────────────────────────────────
use_wandb:          false
use_mlflow:         false
wandb_project:      "ua-street-geolocation"
wandb_run_name:     "baseline-efficientnet-b2-sv"
mlflow_uri:         "mlruns"
experiment_name:    "geolocation-baseline-v2"

# ── Збереження ───────────────────────────────────────────────────────────────
checkpoint_dir:     "checkpoints/baseline_v2"
save_top_k:         3

# ── Відтворюваність ──────────────────────────────────────────────────────────
seed:               42
mixed_precision:    true
cudnn_benchmark:    true
