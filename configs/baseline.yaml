# =============================================================================
# baseline.yaml — flat-конфіг для train.py / TrainConfig
# Архітектура: EfficientNet-B2 + кастомна голова класифікатора
# =============================================================================

# ── Дані ─────────────────────────────────────────────────────────────────────
manifest_path:      "dataset/manifests/train.csv"   # + сусідні val.csv/test.csv
image_root:         "dataset_fast"   # зменшені до 384px (scripts/preprocess_resize.py)
countries:          ["PL", "CZ", "HU"]
quality_threshold:  0.0
split_method:       "prebuilt"    # готові спліти (scripts/06_…); без витоку
img_size:           260           # нативна роздільна здатність EfficientNet-B2

# ── Архітектура ──────────────────────────────────────────────────────────────
architecture:       "baseline"
pretrained:         true

# ── Стадія 1: Заморожений backbone ───────────────────────────────────────────
stage1_epochs:      10
stage1_lr:          0.001
stage1_unfreeze_n:  0

# ── Стадія 2: Тонке налаштування останніх блоків ─────────────────────────────
stage2_epochs:      20
stage2_lr:          0.0001
stage2_unfreeze_n:  3             # кількість блоків EfficientNet для розморожування

# ── Оптимізатор / регуляризація ──────────────────────────────────────────────
weight_decay:       0.01
batch_size:         64           # 5090 32GB: EfficientNet-B2 @260px
num_workers:        12           # 16-ядерний CPU
grad_clip:          1.0

# ── Early stopping ───────────────────────────────────────────────────────────
patience:           7
min_delta:          0.0001

# ── Логування ────────────────────────────────────────────────────────────────
use_wandb:          false
use_mlflow:         false
wandb_project:      "ua-street-geolocation"
wandb_run_name:     "baseline-efficientnet-b2"
mlflow_uri:         "mlruns"
experiment_name:    "geolocation-baseline"

# ── Збереження ───────────────────────────────────────────────────────────────
checkpoint_dir:     "checkpoints/baseline"
save_top_k:         3

# ── Відтворюваність ──────────────────────────────────────────────────────────
seed:               42
mixed_precision:    true
cudnn_benchmark:    true
