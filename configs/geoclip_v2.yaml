# =============================================================================
# geoclip_v2.yaml — Street View dataset (Kyiv + Warsaw + Prague + Budapest)
# Архітектура: CLIP ViT + RandomFourierGPSEncoder, InfoNCE (4 класи)
# =============================================================================

# ── Дані ─────────────────────────────────────────────────────────────────────
manifest_path:      "dataset/manifests_sv/train.csv"   # + val.csv/test.csv поруч
image_root:         "."            # filepath = data/images/<city>/...  (SV 640px)
countries:          ["UA", "PL", "CZ", "HU"]
quality_threshold:  0.0
split_method:       "prebuilt"
img_size:           224            # CLIP ViT очікує 224px

# ── Архітектура ──────────────────────────────────────────────────────────────
architecture:       "geoclip"
pretrained:         true

# ── Стадія 1: Навчання GPS-енкодера + голови, CLIP заморожено ────────────────
stage1_epochs:      12
stage1_lr:          0.0005
stage1_unfreeze_n:  0

# ── Стадія 2: Розморожування останніх блоків CLIP ────────────────────────────
stage2_epochs:      18
stage2_lr:          0.0001
stage2_unfreeze_n:  4

# ── Оптимізатор / регуляризація ──────────────────────────────────────────────
weight_decay:       0.01
batch_size:         96
num_workers:        12
grad_clip:          1.0

# ── Early stopping ───────────────────────────────────────────────────────────
patience:           10
min_delta:          0.0001

# ── Логування ────────────────────────────────────────────────────────────────
use_wandb:          false
use_mlflow:         false
wandb_project:      "ua-street-geolocation"
wandb_run_name:     "geoclip-contrastive-sv"
mlflow_uri:         "mlruns"
experiment_name:    "geolocation-geoclip-v2"

# ── Збереження ───────────────────────────────────────────────────────────────
checkpoint_dir:     "checkpoints/geoclip_v2"
save_top_k:         1

# ── Відтворюваність ──────────────────────────────────────────────────────────
seed:               42
mixed_precision:    true
cudnn_benchmark:    true
